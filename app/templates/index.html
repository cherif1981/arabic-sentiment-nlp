<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محلل المشاعر العربية</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-logo">ع</div>
            <div class="brand-text">
                <h2>محلل المشاعر</h2>
                <p>Arabic Sentiment AI</p>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            <span>＋</span> محادثة جديدة
        </button>

        <div class="history-title">المحادثات السابقة</div>
        <div class="history" id="history"></div>

        <div class="sidebar-footer">
            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">جاري الاتصال...</span>
            </div>
            <button class="side-btn" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeLabel">الوضع الليلي</span>
            </button>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <div class="topbar-title">
                <button class="icon-btn menu-btn" onclick="toggleSidebar()">☰</button>
                <span>💬 محادثة جديدة</span>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" onclick="clearChat()" title="مسح المحادثة">🗑</button>
                <button class="icon-btn" onclick="toggleTheme()" title="تبديل المظهر">
                    <span id="themeIconTop">🌙</span>
                </button>
            </div>
        </div>

        <div class="chat" id="chat">
            <div class="chat-inner" id="chatInner">
                <div class="welcome" id="welcome">
                    <div class="welcome-logo">ع</div>
                    <h1>كيف يمكنني مساعدتك؟</h1>
                    <p>اكتب أي نص عربي وسأحلل مشاعره فورًا</p>
                    <div class="chips">
                        <button class="chip" onclick="quickSend('هذا المنتج ممتاز جداً وأنا سعيد بشرائه')">
                            <span class="chip-title">😊 نص إيجابي</span>
                            <span class="chip-sub">تجربة تحليل مشاعر إيجابية</span>
                        </button>
                        <button class="chip" onclick="quickSend('الخدمة سيئة جداً ولا أنصح بها أبداً')">
                            <span class="chip-title">😞 نص سلبي</span>
                            <span class="chip-sub">تجربة تحليل مشاعر سلبية</span>
                        </button>
                        <button class="chip" onclick="quickSend('المنتج عادي، لا شيء مميز فيه')">
                            <span class="chip-title">😐 نص محايد</span>
                            <span class="chip-sub">تجربة تحليل مشاعر محايدة</span>
                        </button>
                        <button class="chip" onclick="quickSend('أحببت هذا التطبيق كثيراً، سريع وسهل الاستخدام!')">
                            <span class="chip-title">⭐ تقييم تطبيق</span>
                            <span class="chip-sub">مثال على مراجعة إيجابية</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="composer-wrap">
            <div class="composer">
                <textarea id="input" rows="1"
                    placeholder="اكتب رسالتك هنا... (Ctrl+Enter للإرسال)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="send()" disabled>➤</button>
            </div>
            <div class="hint">مدعوم بـ scikit-learn و Flask · قد يخطئ النموذج أحيانًا</div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
